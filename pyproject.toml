[project]
name = "agentest"
version = "0.1.0"
description = "Next-Generation Agentic Testing Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Arijit Banerjee", email = "arijitbanerjee8894@gmail.com" }]
license = "MIT"

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "groq>=0.5",
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.0",
    "yfinance>=1.4.1",
    "pandas>=3.0.3",
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-bdd>=7.0",
    "pytest-xdist>=3.8",
    "allure-pytest>=2.16",
    "ruff>=0.3",
    "mypy>=1.8",
]
all = [
    "agentest[dev]",
]

[project.urls]
homepage = "https://github.com/arijitbanerjee12/AgenTest"
repository = "https://github.com/arijitbanerjee12/AgenTest"

[project.scripts]
agentest = "agentest.cli:main"

[tool.setuptools.packages.find]
include = ["agentest", "agentest.*"]
exclude = ["agentest_app", "agentest_app.*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "focus_scan: focus scan — ETFs + top 30 large caps (default workflow)",
    "etf: ETF scan signal detection",
    "large_cap_focus: top 30 large caps in the focus universe",
    "summary: cumulative dashboard summary that runs after per-stock tests",
    "indicator_test: tests that fetch market data and compute trading indicators",
    "btst_scan: BTST backtest — indices + top 10 large caps on hourly data",
]
