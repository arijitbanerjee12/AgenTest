openapi: 3.1.0
info:
  title: AgenTest LLM Gateway
  version: 0.1.0
  description: OpenAI-compatible proxy to Groq LLM API with streaming, tool calls, and JSON mode.

servers:
  - url: http://localhost:8000
    description: Local dev server

paths:
  /v1/chat/completions:
    post:
      summary: Create a chat completion (non-streaming)
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Successful completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        "502":
          description: Upstream Groq error

  /v1/chat/completions/stream:
    post:
      summary: Create a streaming chat completion
      operationId: createChatCompletionStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Newline-delimited JSON stream
          content:
            application/x-ndjson:
              schema:
                type: string

  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

components:
  schemas:
    ChatMessage:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
          nullable: true

    ToolFunction:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object

    ToolDefinition:
      type: object
      required: [type]
      properties:
        type:
          type: string
        function:
          $ref: "#/components/schemas/ToolFunction"

    ResponseFormat:
      type: object
      properties:
        type:
          type: string
          enum: [text, json_object]
          default: text

    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
          default: openai/gpt-oss-120b
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          default: 1.0
        max_completion_tokens:
          type: integer
          default: 8192
        top_p:
          type: number
          default: 1.0
        reasoning_effort:
          type: string
          nullable: true
        stream:
          type: boolean
          default: false
        response_format:
          $ref: "#/components/schemas/ResponseFormat"
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          nullable: true
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolDefinition"
          nullable: true

    ToolCall:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string

    ChoiceMessage:
      type: object
      properties:
        role:
          type: string
        content:
          type: string
          nullable: true
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"

    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    Choice:
      type: object
      properties:
        index:
          type: integer
        message:
          $ref: "#/components/schemas/ChoiceMessage"
        finish_reason:
          type: string
          nullable: true

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          default: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/Choice"
        usage:
          $ref: "#/components/schemas/Usage"
