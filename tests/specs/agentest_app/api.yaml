base_url: http://localhost:8001

endpoints:
  chat_completion:
    method: POST
    path: /v1/chat/completions
    body_dir: tests/data/agentest_app/chat_completion

  streaming:
    method: POST
    path: /v1/chat/completions/stream
    body_dir: tests/data/agentest_app/chat_completion

  health:
    method: GET
    path: /health
